<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // Prevent and handle "Cannot set property fetch of #<Window> which has only a getter"
        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            (event.message.indexOf('Cannot set property fetch') !== -1 ||
             (event.message.indexOf('fetch') !== -1 && event.message.indexOf('only a getter') !== -1))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var protoFetch = proto.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return customFetch || protoFetch;
                },
                set: function(val) {
                  customFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
